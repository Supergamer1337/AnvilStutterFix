name: Build

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  LLVM_MINGW_VERSION: "20261020"
  LLVM_MINGW_SHA256: fd5462b7f5d93b2ff981fcd3f9c7e427e47f3203c64ea91c27bcc444eebd74cd

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        preset: [release, debug]
    env:
      CC: x86_64-w64-mingw32-clang
      CXX: x86_64-w64-mingw32-clang++
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: lukka/get-cmake@v4.4.2
        with:
          cmakeVersion: 4.4.2
          ninjaVersion: 1.13.2

      - name: Cache llvm-mingw
        id: toolchain
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/llvm-mingw
          key: llvm-mingw-${{ env.LLVM_MINGW_VERSION }}-ucrt-x86_64

      - name: Download llvm-mingw
        if: steps.toolchain.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $name = "llvm-mingw-$env:LLVM_MINGW_VERSION-ucrt-x86_64"
          $zip  = Join-Path $env:RUNNER_TEMP "$name.zip"
          Invoke-WebRequest "https://github.com/mstorsjo/llvm-mingw/releases/download/$env:LLVM_MINGW_VERSION/$name.zip" -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $env:LLVM_MINGW_SHA256) { throw "Checksum mismatch for $name.zip" }
          & "$env:SystemRoot\System32\tar.exe" -xf $zip -C $env:RUNNER_TEMP
          Rename-Item (Join-Path $env:RUNNER_TEMP $name) llvm-mingw

      - name: Add llvm-mingw to PATH
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH (Join-Path $env:RUNNER_TEMP 'llvm-mingw\bin')

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} "-DASF_VERSION=${{ github.event.release.tag_name }}" "-DCMAKE_COMPILE_WARNING_AS_ERROR=ON"

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Package
        run: cmake --install build/${{ matrix.preset }} --prefix build/package --component AnvilStutterFix

      - uses: actions/upload-artifact@v7
        with:
          name: AnvilStutterFix-${{ matrix.preset }}
          path: build/package/
          if-no-files-found: error

  upload:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Attach to the release
        working-directory: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          for variant in release debug; do
            (cd "AnvilStutterFix-$variant" && zip -q "../AnvilStutterFix-$variant.zip" *)
          done
          gh release upload "$TAG" AnvilStutterFix-release.zip AnvilStutterFix-debug.zip --repo "$GITHUB_REPOSITORY" --clobber
